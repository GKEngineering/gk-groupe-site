# Garde le projet Supabase (forfait gratuit) actif : sans activité pendant ~7 jours,
# Supabase le met en pause et l'espace client affiche « Failed to fetch ».
# Fait une petite requête à la base tous les 3 jours. La clé utilisée est la clé publique du site.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête à la base Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "apikey: sb_publishable_RbN1_bNA5aHln-vhS3CjBQ_TDq3Tq2H" \
            -H "Content-Type: application/json" \
            -d '{"p_numero":"KEEPALIVE"}' \
            https://elkaenirztjvsslrcwsz.supabase.co/rest/v1/rpc/suivre_livraison)
          echo "Réponse Supabase : $code"
          test "$code" = "200"
